<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGMA</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<div class="app-layout">
  <div class="sidebar-overlay"></div>

  <aside class="sidebar">
        <div class="sidebar-logo">
      <div class="sidebar-logo-text" style="line-height:1.1;">
        <span style="font-size:1rem;font-weight:700;letter-spacing:3px;color:#fff;">SGMA</span>
        <span style="display:block;font-size:.65rem;font-weight:400;color:var(--gray-400);letter-spacing:.5px;margin-top:2px;">Ger. de Manutenção</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section">Menu</div>
      <button class="nav-item active" data-view="dashboard">
        Dashboard
      </button>
      <button class="nav-item" data-view="atividades">
        Atividades
      </button>
      <button class="nav-item" data-view="nova">
        Nova Atividade
      </button>
      <button class="nav-item" data-view="historico">
        Histórico
      </button>
      <div class="nav-section" id="nav-admin-section" style="display:none;">Admin</div>
      <a class="nav-item" href="admin.html" id="nav-admin-link" style="display:none;">
        Administração
      </a>
      <a class="nav-item" href="relatorio.html" id="nav-rel-link" style="display:none;">
        Relatórios
      </a>
    </nav>

    <div class="sidebar-user">
      <div class="user-info">
        <div class="user-name" id="user-name">Carregando...</div>
        <div class="user-role" id="user-role"></div>
      </div>
      <button class="logout-btn" title="Sair">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </aside>

  <div class="main-content">
    <header class="topbar">
      <button class="topbar-hamburger btn-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <span class="topbar-title" id="topbar-title">Dashboard</span>
      <div class="topbar-actions">
        <button class="btn btn-ghost btn-sm btn-icon" onclick="loadAll().then(()=>setView('dashboard'))" title="Atualizar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
        </button>
      </div>
    </header>

    <!-- DASHBOARD -->
    <div class="page-content view-section" data-section="dashboard">
      <div id="dashboard-content"></div>
    </div>

    <!-- ATIVIDADES -->
    <div class="page-content view-section hidden" data-section="atividades">
      <div class="filter-bar">
        <button class="filter-chip active" data-filter="todas">Todas</button>
        <button class="filter-chip" data-filter="pendentes">Pendentes</button>
        <button class="filter-chip" data-filter="concluidas">Concluídas</button>
        <button class="filter-chip" data-filter="nao_realizadas">Não realizadas</button>
        <button class="filter-chip" data-filter="fora_prog">Fora prog.</button>
        <button class="filter-chip" data-filter="ver_agir">Ver e Agir</button>
      </div>
      <div id="atividades-list"></div>
    </div>

    <!-- HISTÓRICO -->
    <div class="page-content view-section hidden" data-section="historico">
      <div style="margin-bottom:1rem;"><h1>Histórico de Execuções</h1></div>
      <div id="historico-wrap"></div>
    </div>

    <!-- NOVA -->
    <div class="page-content view-section hidden" data-section="nova">
      <div class="page-header"><h1>Nova Atividade</h1></div>
      <div id="nova-form"></div>
    </div>
  </div>

  <!-- Detail panel -->
  <div class="detail-panel">
    <!-- OM header -->
    <div class="om-header" id="om-header">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;">
        <div style="flex:1;min-width:0;">
          <div class="om-header-label">Ordem de Manutenção</div>
          <div class="om-header-number" id="detail-om">—</div>
          <div class="om-header-desc" id="detail-desc">—</div>
        </div>
        <button class="btn btn-ghost btn-icon" id="detail-close"
          style="color:rgba(255,255,255,.6);flex-shrink:0;margin-top:-4px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>
    <div class="detail-body" id="detail-body">
      <div id="detail-info"></div>
    </div>
    <div class="detail-footer">
      <div class="detail-footer-row">
        <button class="btn btn-secondary flex-1" onclick="document.querySelector('.detail-panel').classList.remove('open')">Fechar</button>
        <button class="btn btn-ghost flex-1" id="btn-save-progresso">💾 Salvar progresso</button>
      </div>
      <button class="btn btn-primary w-full" id="btn-save-exec">✅ Finalizar e registrar</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script src="assets/js/api.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/auth.js"></script>
<script>
  // Mostrar links de admin/relatorio para supervisor e admin após login
  document.addEventListener('DOMContentLoaded', () => {
    const s = JSON.parse(sessionStorage.getItem('mnt_session') || 'null');
    if (s && (s.perfil === 'admin' || s.perfil === 'supervisor')) {
      document.getElementById('nav-admin-section').style.display = '';
      document.getElementById('nav-rel-link').style.display = '';
      if (s.perfil === 'admin') document.getElementById('nav-admin-link').style.display = '';
    }
  });
</script>
<script src="assets/js/app.js"></script>
</body>
</html>
