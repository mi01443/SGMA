<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GestManu — Atividades</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<div class="app-layout">

  <!-- Sidebar overlay (mobile) -->
  <div class="sidebar-overlay"></div>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
          <path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/>
        </svg>
      </div>
      <div class="sidebar-logo-text">GestManu <span>Gestão de Manutenção</span></div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section">Campo</div>
      <button class="nav-item active" data-view="atividades">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2M9 12l2 2 4-4"/></svg>
        Atividades
      </button>
      <button class="nav-item" data-view="nova">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        Nova Atividade
      </button>
      <button class="nav-item" data-view="historico">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Histórico
      </button>
    </nav>

    <div class="sidebar-user">
      <div class="user-avatar" id="user-avatar">--</div>
      <div class="user-info">
        <div class="user-name" id="user-name">Carregando...</div>
        <div class="user-role" id="user-role"></div>
      </div>
      <button class="logout-btn" title="Sair">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </aside>

  <!-- Main -->
  <div class="main-content">
    <header class="topbar">
      <button class="topbar-hamburger btn-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <span class="topbar-title" id="topbar-title">Minhas Atividades</span>
      <div class="topbar-actions">
        <button class="btn btn-ghost btn-sm btn-icon" onclick="loadAll()" title="Atualizar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
        </button>
      </div>
    </header>

    <!-- ATIVIDADES -->
    <div class="page-content view-section" data-section="atividades">
      <!-- Stats do dia -->
      <div class="stat-cards">
        <div class="stat-card">
          <div class="stat-card-label">Total hoje</div>
          <div class="stat-card-value" id="stat-total">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-label">Concluídas</div>
          <div class="stat-card-value" id="stat-concluidas" style="color:var(--success);">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-label">Pendentes</div>
          <div class="stat-card-value" id="stat-pendentes" style="color:var(--warning);">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-label">Execução</div>
          <div class="stat-card-value" id="stat-pct" style="color:var(--primary);">—</div>
        </div>
      </div>

      <!-- Barra HH -->
      <div class="hh-bar-wrap card" style="padding:.75rem 1rem;margin-bottom:1rem;">
        <div class="hh-labels"><span>Progresso do dia</span></div>
        <div class="hh-bar-track" style="height:8px;">
          <div class="hh-bar-prog" id="hh-bar-prog" style="width:0%"></div>
        </div>
      </div>

      <!-- Filtros -->
      <div class="filter-bar">
        <button class="filter-chip active" data-filter="todas">Todas</button>
        <button class="filter-chip" data-filter="pendentes">Pendentes</button>
        <button class="filter-chip" data-filter="concluidas">Concluídas</button>
        <button class="filter-chip" data-filter="nao_realizadas">Não realizadas</button>
        <button class="filter-chip" data-filter="fora_prog">Fora prog.</button>
        <button class="filter-chip" data-filter="ver_agir">Ver e Agir</button>
      </div>

      <div id="atividades-list"></div>
    </div>

    <!-- HISTÓRICO -->
    <div class="page-content view-section hidden" data-section="historico">
      <div class="page-header">
        <h1>Histórico de Execuções</h1>
        <p>Manutenções registradas por você</p>
      </div>
      <div id="historico-list"></div>
    </div>

    <!-- NOVA ATIVIDADE -->
    <div class="page-content view-section hidden" data-section="nova">
      <div class="page-header">
        <h1>Nova Atividade</h1>
        <p>Registre atividades fora de programação ou Ver &amp; Agir</p>
      </div>
      <div id="nova-form"></div>
    </div>
  </div>

  <!-- Detail panel -->
  <div class="detail-panel">
    <div class="detail-header">
      <div>
        <div class="fw-600" id="detail-equip">—</div>
        <div class="text-sm text-muted" id="detail-desc">—</div>
      </div>
      <button class="btn btn-ghost btn-sm btn-icon detail-close" id="detail-close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="detail-body">
      <div id="detail-info"></div>
      <div id="detail-checklist" class="detail-section"></div>
      <div id="detail-exec-form"></div>
    </div>
    <div class="detail-footer">
      <button class="btn btn-secondary flex-1" id="btn-cancel-exec" onclick="document.querySelector('.detail-panel').classList.remove('open')">Cancelar</button>
      <button class="btn btn-primary flex-1" id="btn-save-exec">💾 Registrar</button>
    </div>
  </div>

</div><!-- /app-layout -->

<div id="toast-container"></div>

<script src="assets/js/api.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
