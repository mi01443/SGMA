<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGMA — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100vh; font-family: 'Inter', sans-serif;
      background: #050d1a;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; position: relative;
    }

    /* Background geometric shapes */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 30%, rgba(22,78,155,0.45) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 70%, rgba(14,52,110,0.3) 0%, transparent 60%),
        radial-gradient(ellipse 40% 40% at 60% 10%, rgba(37,99,235,0.15) 0%, transparent 50%);
    }

    /* Big R watermark right side */
    body::after {
      content: 'R';
      position: fixed; right: -40px; top: 50%; transform: translateY(-50%);
      font-size: 520px; font-weight: 800; color: rgba(37,99,235,0.07);
      line-height: 1; z-index: 0; pointer-events: none; user-select: none;
      font-family: 'Inter', sans-serif;
    }

    .login-wrapper {
      position: relative; z-index: 1;
      width: 100%; max-width: 440px; padding: 1rem;
    }

    .login-card {
      background: rgba(8, 20, 45, 0.75);
      border: 1px solid rgba(37,99,235,0.25);
      border-radius: 24px;
      overflow: hidden;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    /* Top brand section */
    .brand-section {
      padding: 2.5rem 2rem 2rem;
      background: linear-gradient(160deg, rgba(15,40,90,0.9) 0%, rgba(8,22,55,0.6) 100%);
      border-bottom: 1px solid rgba(37,99,235,0.2);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .brand-section::before {
      content: '';
      position: absolute; top: -30px; right: -20px;
      width: 200px; height: 200px;
      border: 1px solid rgba(37,99,235,0.12);
      border-radius: 50%; transform: rotate(15deg);
    }
    .brand-section::after {
      content: '';
      position: absolute; top: 10px; right: 20px;
      width: 120px; height: 120px;
      border: 1px solid rgba(37,99,235,0.08);
      border-radius: 50%;
    }

    .logo-row {
      display: flex; align-items: center; justify-content: center;
      gap: 14px; margin-bottom: 10px; position: relative; z-index: 1;
    }

    /* Hexagonal logo icon */
    .logo-icon {
      width: 56px; height: 56px; position: relative; flex-shrink: 0;
    }
    .logo-icon svg { width: 100%; height: 100%; }

    .logo-name {
      font-size: 2.75rem; font-weight: 800; color: #fff;
      letter-spacing: 3px; line-height: 1;
    }

    .logo-sub {
      font-size: .6875rem; color: rgba(148,163,184,0.8);
      letter-spacing: 3px; text-transform: uppercase; font-weight: 400;
      margin-top: 4px; position: relative; z-index: 1;
    }

    /* Form section */
    .form-section { padding: 2rem; }

    .field-label {
      display: block; font-size: .9375rem; font-weight: 500;
      color: #e2e8f0; margin-bottom: 8px;
    }

    .field-wrap {
      position: relative; margin-bottom: 1.25rem;
    }
    .field-icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      width: 20px; height: 20px; color: rgba(99,139,235,0.7);
      display: flex; align-items: center; justify-content: center;
    }
    .field-wrap input {
      width: 100%; height: 52px;
      background: rgba(15,35,80,0.6);
      border: 1px solid rgba(37,99,235,0.3);
      border-radius: 12px;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif; font-size: .9375rem;
      padding: 0 44px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .field-wrap input::placeholder { color: rgba(148,163,184,0.5); }
    .field-wrap input:focus {
      border-color: rgba(59,130,246,0.7);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.18);
      background: rgba(15,40,95,0.7);
    }

    .toggle-pass {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      color: rgba(99,139,235,0.6); cursor: pointer; background: none; border: none;
      padding: 4px; display: flex; align-items: center; justify-content: center;
      transition: color .15s;
    }
    .toggle-pass:hover { color: rgba(99,139,235,1); }

    /* Remember + forgot */
    .remember-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1.5rem;
    }
    .remember-label {
      display: flex; align-items: center; gap: 8px;
      font-size: .875rem; color: rgba(148,163,184,0.8); cursor: pointer;
    }
    .remember-label input[type=checkbox] { display: none; }
    .check-box {
      width: 18px; height: 18px; border: 1.5px solid rgba(37,99,235,0.5);
      border-radius: 4px; background: rgba(15,35,80,0.5);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      transition: all .15s;
    }
    .remember-label input:checked + .check-box {
      background: #2563eb; border-color: #2563eb;
    }
    .check-box svg { display: none; }
    .remember-label input:checked + .check-box svg { display: block; }

    .forgot-link {
      font-size: .875rem; color: #60a5fa; text-decoration: none; font-weight: 500;
    }
    .forgot-link:hover { color: #93c5fd; }

    /* Submit button */
    .btn-entrar {
      width: 100%; height: 52px; border: none; border-radius: 12px;
      background: linear-gradient(90deg, #1d4ed8 0%, #2563eb 50%, #3b82f6 100%);
      color: #fff; font-family: 'Inter', sans-serif;
      font-size: 1rem; font-weight: 600; cursor: pointer;
      letter-spacing: .5px; transition: opacity .15s, transform .1s;
      position: relative; overflow: hidden;
    }
    .btn-entrar::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.08) 0%, transparent 100%);
    }
    .btn-entrar:hover { opacity: .93; }
    .btn-entrar:active { transform: scale(0.99); }
    .btn-entrar:disabled { opacity: .5; cursor: not-allowed; }

    /* Error */
    .login-error {
      color: #f87171; font-size: .8125rem; text-align: center;
      min-height: 18px; margin-bottom: .75rem; font-weight: 500;
    }

    /* Footer */
    .login-footer {
      padding: 1.25rem 2rem 1.75rem;
      border-top: 1px solid rgba(37,99,235,0.15);
    }
    .version-row {
      display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
    }
    .version-line { flex: 1; height: 1px; background: rgba(37,99,235,0.2); }
    .version-text { font-size: .75rem; color: rgba(148,163,184,0.5); letter-spacing: .5px; }

    .secure-row {
      display: flex; align-items: center; gap: 10px;
    }
    .secure-icon {
      width: 32px; height: 32px; border-radius: 8px;
      background: rgba(37,99,235,0.15); border: 1px solid rgba(37,99,235,0.3);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .secure-text { font-size: .75rem; color: rgba(148,163,184,0.6); line-height: 1.4; }

    /* Spinner */
    .spinner-inline {
      display: inline-block; width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff; border-radius: 50%;
      animation: spin .65s linear infinite; vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Mobile */
    @media (max-width: 480px) {
      .brand-section { padding: 2rem 1.5rem 1.75rem; }
      .form-section  { padding: 1.5rem; }
      .login-footer  { padding: 1rem 1.5rem 1.5rem; }
      .logo-name     { font-size: 2.25rem; }
      body::after    { display: none; }
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">

      <!-- Brand -->
      <div class="brand-section">
        <div class="logo-row">
          <!-- Logo icon hexagonal R -->
          <div class="logo-icon">
            <svg viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="iconGrad" x1="0" y1="0" x2="56" y2="56" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#60a5fa"/>
                  <stop offset="100%" stop-color="#2563eb"/>
                </linearGradient>
              </defs>
              <!-- Hexagon base -->
              <path d="M28 3 L51 16 L51 40 L28 53 L5 40 L5 16 Z"
                fill="url(#iconGrad)" opacity="0.18"/>
              <path d="M28 3 L51 16 L51 40 L28 53 L5 40 L5 16 Z"
                fill="none" stroke="url(#iconGrad)" stroke-width="1.5" opacity="0.6"/>
              <!-- R letterform -->
              <path d="M19 14 L19 42 M19 14 L33 14 C38 14 41 17 41 22 C41 27 38 30 33 30 L19 30 M33 30 L41 42"
                stroke="url(#iconGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="logo-name">SGMA</div>
        </div>
        <div class="logo-sub">Sistema de Gerenciamento de Manutenção</div>
      </div>

      <!-- Form -->
      <div class="form-section">
        <div id="login-error" class="login-error"></div>

        <form id="login-form">
          <label class="field-label">Usuário</label>
          <div class="field-wrap">
            <div class="field-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
              </svg>
            </div>
            <input type="text" id="usuario" placeholder="seu.usuario" autocomplete="username" required>
          </div>

          <label class="field-label">Senha</label>
          <div class="field-wrap">
            <div class="field-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <rect x="5" y="11" width="14" height="10" rx="2"/>
                <path d="M8 11V7a4 4 0 018 0v4"/>
              </svg>
            </div>
            <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password" required>
            <button type="button" class="toggle-pass" id="toggle-senha" aria-label="Mostrar senha">
              <svg id="icon-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg id="icon-eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="display:none;">
                <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>

          <div class="remember-row">
            <label class="remember-label">
              <input type="checkbox" id="lembrar-me">
              <div class="check-box">
                <svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round">
                  <polyline points="2,6 5,9 10,3"/>
                </svg>
              </div>
              Lembrar-me
            </label>
            <a href="#" class="forgot-link">Esqueci minha senha</a>
          </div>

          <button type="submit" class="btn-entrar" id="btn-login">Entrar</button>
        </form>
      </div>

      <!-- Footer -->
      <div class="login-footer">
        <div class="version-row">
          <div class="version-line"></div>
          <span class="version-text">Versão 1.0</span>
          <div class="version-line"></div>
        </div>
        <div class="secure-row">
          <div class="secure-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="1.8">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              <polyline points="9 12 11 14 15 10"/>
            </svg>
          </div>
          <div class="secure-text">Segurança, confiabilidade e eficiência<br>na gestão da manutenção.</div>
        </div>
      </div>

    </div>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    // Toggle senha visível
    document.getElementById('toggle-senha').addEventListener('click', function() {
      const input = document.getElementById('senha');
      const eyeOn  = document.getElementById('icon-eye');
      const eyeOff = document.getElementById('icon-eye-off');
      if (input.type === 'password') {
        input.type = 'text';
        eyeOn.style.display  = 'none';
        eyeOff.style.display = 'block';
      } else {
        input.type = 'password';
        eyeOn.style.display  = 'block';
        eyeOff.style.display = 'none';
      }
    });

    // Lembrar-me — salva usuário no localStorage
    window.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem('sgma_lembrar');
      if (saved) {
        document.getElementById('usuario').value = saved;
        document.getElementById('lembrar-me').checked = true;
      }
    });
  </script>
</body>
</html>
