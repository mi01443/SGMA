<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGMA — Login</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #0f172a; }
    .login-wrap { width: 100%; max-width: 380px; padding: 1rem; }
    .login-card { background: #fff; border-radius: 20px; padding: 2rem; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }

    /* Logo */
    .splash-logo { text-align: center; margin-bottom: 2rem; }
    .logo-badge {
      width: 80px; height: 80px; background: #1a56db; border-radius: 20px;
      display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
      margin-bottom: 14px;
    }
    .logo-initials { font-size: 24px; font-weight: 700; color: white; letter-spacing: 3px; line-height: 1; }
    .logo-div { width: 40px; height: 1px; background: rgba(255,255,255,0.35); margin: 5px 0; }
    .logo-subt { font-size: 8px; color: rgba(255,255,255,0.6); letter-spacing: 2px; }

    .app-name { font-size: 22px; font-weight: 700; color: #111827; letter-spacing: 4px; }
    .app-desc { font-size: 11px; color: #6b7280; letter-spacing: 1px; margin-top: 3px; }

    .login-error { color: var(--danger); font-size: .825rem; text-align: center; min-height: 20px; margin-bottom: .5rem; }
    .login-footer { text-align: center; margin-top: 1.5rem; font-size: .72rem; color: #9ca3af; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="splash-logo">
        <div class="logo-badge">
          <div class="logo-initials">RGS</div>
          <div class="logo-div"></div>
          <div class="logo-subt">SGMA</div>
        </div>
        <div class="app-name">SGMA</div>
        <div class="app-desc">SISTEMA DE GERENCIAMENTO DE MANUTENÇÃO</div>
      </div>

      <div id="login-error" class="login-error"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="usuario">Usuário</label>
          <input type="text" id="usuario" class="form-control" placeholder="seu.usuario" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="senha">Senha</label>
          <input type="password" id="senha" class="form-control" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <button type="submit" id="btn-login" class="btn btn-primary btn-block btn-lg" style="margin-top:.5rem;">
          Entrar
        </button>
      </form>

      <div class="login-footer">SGMA v1.0 · Sistema de Gerenciamento de Manutenção</div>
    </div>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
