<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GestManu — Login</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--gray-100); }
    .login-card { width: 100%; max-width: 380px; padding: 2rem; }
    .login-logo { text-align: center; margin-bottom: 2rem; }
    .login-logo-icon {
      width: 56px; height: 56px; background: var(--primary); border-radius: 16px;
      display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px;
    }
    .login-logo h1 { font-size: 1.5rem; color: var(--gray-900); }
    .login-logo p { color: var(--gray-500); font-size: .875rem; margin-top: 4px; }
    .login-error { color: var(--danger); font-size: .825rem; text-align: center; min-height: 20px; margin-bottom: .5rem; }
    .login-footer { text-align: center; margin-top: 1.5rem; font-size: .75rem; color: var(--gray-400); }
  </style>
</head>
<body>
  <div class="login-card card">
    <div class="login-logo">
      <div class="login-logo-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
          <path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/>
        </svg>
      </div>
      <h1>GestManu</h1>
      <p>Gestão de Manutenção Industrial</p>
    </div>

    <div id="login-error" class="login-error"></div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="usuario">Usuário</label>
        <input type="text" id="usuario" class="form-control" placeholder="seu.usuario" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="senha">Senha</label>
        <input type="password" id="senha" class="form-control" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" id="btn-login" class="btn btn-primary btn-block btn-lg" style="margin-top:.5rem;">
        Entrar
      </button>
    </form>

    <div class="login-footer">GestManu v1.0 — Sistema de Gestão de Manutenção</div>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
