<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGMA — Relatórios</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<div class="app-layout">

  <div class="sidebar-overlay"></div>

  <aside class="sidebar">
        <div class="sidebar-logo">
      <div class="sidebar-logo-text" style="line-height:1.1;">
        <span style="font-size:1rem;font-weight:700;letter-spacing:3px;color:#fff;">SGMA</span>
        <span style="display:block;font-size:.65rem;font-weight:400;color:var(--gray-400);letter-spacing:.5px;margin-top:2px;">Ger. de Manutenção</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section">Sistema</div>
      <a class="nav-item" href="app.html">
        Atividades
      </a>
      <a class="nav-item active" href="relatorio.html">
        Relatórios
      </a>
      <a class="nav-item" href="admin.html">
        Administração
      </a>
    </nav>

    <div class="sidebar-user">
      <div class="user-info">
        <div class="user-name" id="user-name">Carregando...</div>
        <div class="user-role" id="user-role"></div>
      </div>
      <button class="logout-btn" title="Sair">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </aside>

  <div class="main-content">
    <header class="topbar">
      <button class="topbar-hamburger btn-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <span class="topbar-title">Relatório de Manutenção</span>
      <div class="topbar-actions" id="rel-actions" style="display:none;">
        <button class="btn btn-secondary btn-sm" id="btn-pdf" style="gap:6px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          PDF
        </button>
        <button class="btn btn-success btn-sm" id="btn-whatsapp" style="gap:6px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.127.558 4.121 1.533 5.848L.054 23.27l5.538-1.454A11.938 11.938 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.818 9.818 0 01-5.012-1.374l-.36-.213-3.288.863.878-3.207-.233-.37A9.818 9.818 0 012.182 12C2.182 6.571 6.571 2.182 12 2.182S21.818 6.571 21.818 12 17.429 21.818 12 21.818z"/></svg>
          WhatsApp
        </button>
      </div>
    </header>

    <div class="page-content">
      <!-- Filtros -->
      <div class="card mb-3">
        <div class="card-header"><span class="card-title">🔍 Filtros do Relatório</span></div>
        <div class="form-row" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;">
          <div class="form-group" style="margin-bottom:0;">
            <label class="form-label">Semana</label>
            <select id="filtro-semana" class="form-control"></select>
          </div>
          <div class="form-group" style="margin-bottom:0;">
            <label class="form-label">Data início</label>
            <input type="date" id="filtro-inicio" class="form-control">
          </div>
          <div class="form-group" style="margin-bottom:0;">
            <label class="form-label">Data fim</label>
            <input type="date" id="filtro-fim" class="form-control">
          </div>
          <div class="form-group" style="margin-bottom:0;">
            <label class="form-label">Técnico</label>
            <select id="filtro-tecnico" class="form-control"></select>
          </div>
        </div>
        <div style="margin-top:1rem;display:flex;justify-content:flex-end;">
          <button class="btn btn-primary" id="btn-gerar">📊 Gerar Relatório</button>
        </div>
      </div>

      <!-- Output -->
      <div id="relatorio-output"></div>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script src="assets/js/api.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/relatorio.js"></script>
</body>
</html>
